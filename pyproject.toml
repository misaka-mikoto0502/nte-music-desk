[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nte-music-desk"
version = "2.1.0"
description = "Windows music desk for NTE: local scores, on-device audio-to-MIDI, and automatic in-game piano performance"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "NTE Music Desk contributors"}]
dependencies = ["Pillow>=10.3,<14", "numpy==2.2.6", "onnxruntime==1.22.1"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: MIDI",
]

[project.urls]
Homepage = "https://github.com/misaka-mikoto0502/nte-music-desk"
Documentation = "https://github.com/misaka-mikoto0502/nte-music-desk/blob/main/docs/USAGE.md"
Issues = "https://github.com/misaka-mikoto0502/nte-music-desk/issues"
Changelog = "https://github.com/misaka-mikoto0502/nte-music-desk/blob/main/CHANGELOG.md"
Releases = "https://github.com/misaka-mikoto0502/nte-music-desk/releases"

[project.gui-scripts]
nte-music-desk = "nte_music_desk.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nte_music_desk = ["assets/*", "assets/scores/*.mid", "assets/scores/*.musicxml"]
