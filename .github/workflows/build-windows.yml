name: Build Windows portable app
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install desktop dependencies
        run: python -m pip install -e .
      - name: Test source without game input
        run: python -m unittest discover -s tests -v
      - name: Check sample workflows without game input
        run: python tools/check_workflows.py --output .build/validation/ci-workflows
      - name: Check JavaScript and release metadata
        shell: pwsh
        run: |
          node tools/light_audio_web/test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_release.py
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Prepare bundled offline models and native runtimes
        run: python tools/prepare_offline_audio.py
      - name: Build portable EXE
        run: python tools/build_windows.py
      - name: Check independently extracted frozen runtime without game input
        run: python tools/verify_release.py
      - name: Package clean source
        run: python tools/package_source.py
      - uses: actions/upload-artifact@v7
        with:
          name: NTE-Music-Desk-Windows-x64
          path: |
            releases/**/*.zip
            releases/**/*.sha256
          if-no-files-found: error
