name: Build Windows portable app
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Test source without game input
        run: python -m unittest discover -s tests -v
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Build portable EXE
        run: python tools/build_windows.py
      - name: Check frozen runtime without game input
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'releases/异环演奏工作台/异环演奏工作台.exe'
          $report = Join-Path $env:RUNNER_TEMP 'nte-self-test.json'
          $data = Join-Path $env:RUNNER_TEMP 'nte-test-data'
          $process = Start-Process -FilePath $app -ArgumentList @('--data-dir', ('"' + $data + '"'), '--self-test', ('"' + $report + '"')) -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Frozen self-test failed' }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($result.status -ne 'passed' -or $result.game_input_sent) { throw 'Invalid self-test result' }
      - uses: actions/upload-artifact@v7
        with:
          name: NTE-Music-Desk-Windows-x64
          path: |
            releases/*.zip
            releases/*.sha256
          if-no-files-found: error
